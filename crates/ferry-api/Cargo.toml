[package]
name = "ferry-api"
description = "REST API, change feed, webhooks, blueprints and the embedded web client for Ferry"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
chrono.workspace = true
# Read-only batch queries of the change feed (the Store's own pool).
sqlx.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
subtle = "2.6"
form_urlencoded = "1.2"
# Git connections: authorizing GitHub / GitLab accounts, their repositories...
ferry-scm.workspace = true
# ...and the branches of a repository (`git ls-remote`).
ferry-build.workspace = true
# OpenAPI document (`/api/openapi.json`) and Swagger UI (`/api/docs`, assets vendored).
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# The fake git provider reads Basic credentials and the claims of app JWTs.
base64.workspace = true
http-body-util.workspace = true
flate2.workspace = true
tar.workspace = true
