<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Ferry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317202b'/%3E%3Cpath d='M7 17h18l-2.6 5.5H9.6z M11 17v-5h8l2.5 5' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --sunken: #edf0f4;
  --hover: #f1f4f7;
  --ink: #17202b;
  --ink-2: #384352;
  --muted: #5f6b7c;
  --faint: #8792a2;
  --line: #e1e6ec;
  --line-strong: #c9d1db;
  --primary: #17202b;
  --primary-hover: #2a3544;
  --primary-ink: #ffffff;
  --focus: #3b7cf6;
  --link: #1f5fd1;
  --ok: #167c43;       --ok-bg: #e3f4ea;   --ok-line: #b9e2c9;
  --busy: #2461cf;     --busy-bg: #e6eefc; --busy-line: #bfd2f6;
  --bad: #c42f2f;      --bad-bg: #fcebea;  --bad-line: #f2c3c1;
  --warn: #9a5c00;     --warn-bg: #fcf1dc; --warn-line: #efd29b;
  --off: #626b78;      --off-bg: #eceef1;  --off-line: #d3d8de;
  --none: #7c8594;     --none-bg: #f1f3f5; --none-line: #dde1e6;
  --log-bg: #0e141b;
  --log-ink: #d3dbe6;
  --log-muted: #6c7a8d;
  --log-err: #ff9b93;
  --log-sys: #86b7ff;
  --log-line: #1d2631;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-pop: 0 12px 32px rgba(16, 24, 36, .18), 0 2px 6px rgba(16, 24, 36, .08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --side-w: 236px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141a;
    --surface: #151b23;
    --surface-2: #19202a;
    --sunken: #0c1116;
    --hover: #1c2430;
    --ink: #e5eaf1;
    --ink-2: #c3ccd8;
    --muted: #95a1b2;
    --faint: #6f7b8c;
    --line: #242d39;
    --line-strong: #334052;
    --primary: #e5eaf1;
    --primary-hover: #ffffff;
    --primary-ink: #111820;
    --focus: #6ea2ff;
    --link: #7fb0ff;
    --ok: #4fcf86;   --ok-bg: #12291d;   --ok-line: #1f4a31;
    --busy: #74a8ff; --busy-bg: #13223a; --busy-line: #23406d;
    --bad: #ff7b73;  --bad-bg: #321719;  --bad-line: #5a2427;
    --warn: #f0b34d; --warn-bg: #2e2412; --warn-line: #54401b;
    --off: #9aa4b2;  --off-bg: #1e252f;  --off-line: #303a47;
    --none: #8b96a6; --none-bg: #1a212a; --none-line: #2b3441;
    --log-bg: #0a0f14;
    --log-line: #18212b;
    --shadow-pop: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
code, kbd, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.012em; }
h2 { font-size: 15px; font-weight: 620; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 100; background: var(--primary); color: var(--primary-ink); padding: 8px 12px; border-radius: var(--radius); }
.skip:focus { top: 12px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.nowrap { white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.icon { width: 16px; height: 16px; flex: none; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 16px 12px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; color: var(--ink); font-weight: 680; font-size: 17px; letter-spacing: -0.01em; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; }
.brand-mark svg { width: 20px; height: 20px; }
.nav { display: grid; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--radius);
  color: var(--ink-2); font-weight: 500;
}
.nav a:hover { background: var(--hover); text-decoration: none; color: var(--ink); }
.nav a[aria-current="page"] { background: var(--sunken); color: var(--ink); font-weight: 600; }
.nav a .icon { color: var(--muted); }
.nav a[aria-current="page"] .icon { color: var(--ink); }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
.side-foot .kv { display: flex; justify-content: space-between; gap: 8px; }
.side-foot .kv span:last-child { color: var(--ink-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot .signout { margin-top: 6px; justify-self: start; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: currentColor; flex: none; }

.main { min-width: 0; padding: 28px 36px 64px; }
.main:focus { outline: none; }
.page { max-width: 1180px; }

/* ---------- Page header ---------- */
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--ink); }
.crumbs .sep { color: var(--faint); }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head .title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.page-head h1 { overflow-wrap: anywhere; }
.page-head h1:focus { outline: none; }
.page-head .sub { margin-top: 6px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.page-head .sub a { display: inline-flex; align-items: center; gap: 4px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 22px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 9px 12px 10px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border-radius: var(--radius); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink);
  font-weight: 550; font-size: 13.5px; white-space: nowrap;
  cursor: pointer; text-decoration: none;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
.btn:hover { background: var(--hover); text-decoration: none; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-danger { color: var(--bad); border-color: var(--bad-line); }
.btn-danger:hover { background: var(--bad-bg); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-danger-solid:hover { filter: brightness(1.06); background: var(--bad); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--hover); }
.btn[aria-pressed="true"]:not(.btn-icon):not(.btn-ghost) { background: var(--sunken); border-color: var(--line-strong); }
.btn-sm { height: 28px; padding: 0 9px; font-size: 13px; }
.btn-icon { width: 32px; padding: 0; }
.btn-sm.btn-icon { width: 28px; }
.btn[aria-busy="true"] { position: relative; color: transparent !important; }
.btn[aria-busy="true"]::after {
  content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--muted); border-right-color: transparent; animation: spin .7s linear infinite;
}
.btn-primary[aria-busy="true"]::after { border-color: var(--primary-ink); border-right-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Pills & badges ---------- */
.pill {
  --c: var(--none); --cb: var(--none-bg); --cl: var(--none-line);
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 9px; border-radius: 999px;
  background: var(--cb); color: var(--c); border: 1px solid var(--cl);
  font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1;
}
.pill .dot { width: 6px; height: 6px; }
.tone-ok { --c: var(--ok); --cb: var(--ok-bg); --cl: var(--ok-line); }
.tone-busy { --c: var(--busy); --cb: var(--busy-bg); --cl: var(--busy-line); }
.tone-bad { --c: var(--bad); --cb: var(--bad-bg); --cl: var(--bad-line); }
.tone-warn { --c: var(--warn); --cb: var(--warn-bg); --cl: var(--warn-line); }
.tone-off { --c: var(--off); --cb: var(--off-bg); --cl: var(--off-line); }
.tone-none { --c: var(--none); --cb: var(--none-bg); --cl: var(--none-line); }
.pill.tone-busy .dot { animation: pulse 1.4s ease-in-out infinite; }
.pill.tone-busy { background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); background-size: 220% 100%; animation: sheen 2.4s linear infinite; }
@media (prefers-color-scheme: dark) { .pill.tone-busy { background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.07) 50%, transparent 70%); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
@keyframes sheen { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.badge {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
  border-radius: 5px; background: var(--sunken); color: var(--ink-2);
  font-size: 12px; font-weight: 550; white-space: nowrap; border: 1px solid var(--line);
}
.sha { font-family: var(--mono); font-size: 12px; color: var(--ink-2); background: var(--sunken); padding: 1px 5px; border-radius: 4px; }

/* ---------- Panels, tables, lists ---------- */
.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.section-head p { color: var(--muted); font-size: 13px; margin-top: 3px; max-width: 72ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.panel-pad { padding: 18px 20px; }
/* positioned: keeps .sr-only headers inside the scroller */
.table-wrap { overflow-x: auto; position: relative; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.t th:first-child { border-top-left-radius: var(--radius-lg); }
.t th:last-child { border-top-right-radius: var(--radius-lg); }
.t td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--hover); }
.t td.actions { text-align: right; white-space: nowrap; }
.t td.fill { width: 100%; max-width: 0; }
.t td.fill .ellipsis { display: block; }
.t .nowrap, .t .sub { white-space: nowrap; }
.t td.actions .btn + .btn { margin-left: 6px; }
.t .sub { color: var(--muted); font-size: 12.5px; }
.bar { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; margin-top: 4px; width: 90px; }
.bar > i { display: block; height: 100%; background: var(--busy); border-radius: 2px; }
.bar.hot > i { background: var(--warn); }

/* services list (grid rows that collapse on phones) */
.svc-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.svc-row {
  position: relative;
  display: grid; grid-template-columns: minmax(180px, 1.5fr) 130px 130px minmax(160px, 1.4fr) minmax(150px, 1fr);
  gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.svc-row:last-child { border-bottom: 0; }
.svc-row.head { background: var(--surface-2); color: var(--muted); font-size: 12.5px; font-weight: 600; padding-top: 9px; padding-bottom: 9px; }
.svc-row:not(.head):hover { background: var(--hover); }
.svc-name { font-weight: 600; color: var(--ink); font-size: 14.5px; }
.svc-name::after { content: ""; position: absolute; inset: 0; }
.svc-name:hover { text-decoration: none; }
.svc-row:not(.head):hover .svc-name { text-decoration: underline; }
.svc-row .over { position: relative; z-index: 1; }
.svc-deploy { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.linkish { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
.linkish span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.search { position: relative; }
.search input { padding-left: 32px; width: 240px; }
.search .icon { position: absolute; left: 10px; top: 8px; color: var(--faint); pointer-events: none; }

/* Definition grid */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0; }
.fact { padding: 14px 18px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 0; }
.fact dt { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.fact dd { margin: 0; overflow-wrap: anywhere; }
.facts-wrap { overflow: hidden; }
.facts-wrap .facts { margin: 0 -1px -1px 0; }

/* Empty, loading and error states */
.empty { text-align: left; padding: 32px; display: grid; gap: 12px; justify-items: start; }
.empty h2 { font-size: 17px; }
.empty p { color: var(--muted); max-width: 60ch; }
.loading { padding: 40px 0; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-right-color: var(--ink); animation: spin .8s linear infinite; flex: none; }
.skel { display: grid; gap: 10px; padding: 8px 0; }
.skel i { display: block; height: 44px; border-radius: var(--radius); background: linear-gradient(90deg, var(--sunken), var(--hover), var(--sunken)); background-size: 200% 100%; animation: sheen 1.6s linear infinite; }
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-lg); border: 1px solid var(--cl, var(--line)); background: var(--cb, var(--surface-2)); color: var(--ink); margin-bottom: 18px; }
.callout > .icon { color: var(--c, var(--muted)); margin-top: 2px; }
.callout .grow > * + * { margin-top: 6px; }
.callout strong { color: var(--c, var(--ink)); }
.callout pre { margin: 0; }
.callout.offline { position: sticky; top: 8px; z-index: 20; box-shadow: var(--shadow-pop); }

.code {
  position: relative; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 44px 10px 12px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
  white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); margin: 0; min-width: 0;
}
.code .copy { position: absolute; top: 6px; right: 6px; }
.code .c { color: var(--faint); }

/* ---------- Forms ---------- */
.form { display: grid; gap: 26px; max-width: 760px; }
.fieldset { display: grid; gap: 16px; border: 0; padding: 0; margin: 0; min-width: 0; }
.fieldset > legend, .fieldset > .legend { font-size: 15px; font-weight: 620; padding: 0; margin-bottom: 2px; }
.fieldset > .desc { color: var(--muted); font-size: 13px; margin-top: -10px; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field > label, .field > .label { font-weight: 560; font-size: 13.5px; }
.field .hint { color: var(--muted); font-size: 12.5px; }
.field .err { color: var(--bad); font-size: 12.5px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.input, select.input, textarea.input {
  width: 100%; height: 34px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--surface); color: var(--ink);
  transition: border-color .12s ease, box-shadow .12s ease;
}
textarea.input { height: auto; padding: 8px 10px; line-height: 1.5; resize: vertical; }
.input.mono { font-family: var(--mono); font-size: 13px; }
.input::placeholder { color: var(--faint); }
.input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.input[aria-invalid="true"] { border-color: var(--bad); }
select.input { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--primary); flex: none; }
.check .hint { display: block; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tile { position: relative; display: grid; gap: 3px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface); cursor: pointer; }
.tile:hover { border-color: var(--muted); }
.tile input { position: absolute; opacity: 0; pointer-events: none; }
.tile strong { font-weight: 600; font-size: 13.5px; }
.tile span { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.tile:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tile:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.form-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.form-error { color: var(--bad); font-size: 13px; }
.sticky-save {
  position: sticky; bottom: 0; z-index: 5;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-top: 14px; padding: 12px 0;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background-color .15s ease; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s ease; }
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(14px); }
.switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .5; }

/* env editor */
.env { display: grid; gap: 8px; }
.env-row { display: grid; grid-template-columns: minmax(140px, 2fr) minmax(0, 3fr) auto; gap: 8px; align-items: start; }
.env-row .val { display: flex; gap: 4px; align-items: start; min-width: 0; }
.env-row .val .input { flex: 1 1 auto; min-width: 0; }
.env-row textarea.input { min-height: 34px; font-family: var(--mono); font-size: 13px; }
.env-masked { flex: 1 1 auto; text-align: left; justify-content: flex-start; font-family: var(--mono); color: var(--muted); }
.env-head { display: grid; grid-template-columns: minmax(140px, 2fr) minmax(0, 3fr) auto; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 0 2px; }
.env-head span:last-child { width: 32px; }
.env-empty { color: var(--muted); font-size: 13px; padding: 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius); }
.env-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.env-err { color: var(--bad); font-size: 12.5px; grid-column: 1 / -1; margin-top: -4px; }

/* key/value item lists (domains, linked groups) */
.items { display: grid; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.item:last-child { border-bottom: 0; }
.item .grow { overflow-wrap: anywhere; }

.secret { display: flex; gap: 6px; align-items: center; min-width: 0; }
.secret .value { flex: 1 1 auto; min-width: 0; font-family: var(--mono); font-size: 12.5px; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; overflow-wrap: anywhere; line-height: 1.5; }

/* ---------- Deploy route ---------- */
.route { display: flex; align-items: flex-start; margin: 4px 0 20px; max-width: 640px; list-style: none; padding: 0; }
.stop { flex: 1 1 0; position: relative; display: grid; justify-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); text-align: center; }
.stop::before { content: ""; position: absolute; top: 8px; left: calc(-50% + 11px); right: calc(50% + 11px); height: 2px; background: var(--line-strong); }
.stop:first-child::before { display: none; }
.stop .node { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); color: #fff; display: grid; place-items: center; position: relative; z-index: 1; }
.stop.done { color: var(--ink-2); }
.stop.done .node { background: var(--ok); border-color: var(--ok); }
.stop.done::before, .stop.current::before, .stop.failed::before { background: var(--ok); }
.stop.current { color: var(--busy); font-weight: 600; }
.stop.current .node { border-color: var(--busy); }
.stop.current .node::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--busy); animation: pulse 1.4s ease-in-out infinite; }
.stop.failed { color: var(--bad); font-weight: 600; }
.stop.failed .node { border-color: var(--bad); background: var(--bad); color: #fff; }
.stop.halted { color: var(--off); font-weight: 600; }
.stop.halted .node { border-color: var(--off); background: var(--off); }
.stop .node svg { width: 10px; height: 10px; stroke-width: 3.5; }

/* ---------- Log viewer ---------- */
.log { display: flex; flex-direction: column; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); background: var(--log-bg); }
.log-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.log-bar .input { height: 28px; font-size: 13px; }
.log-bar .search input { width: 170px; }
.log-bar .search .icon { top: 6px; }
.log-status { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.log-status.live { color: var(--ok); }
.log-status.live .dot { animation: pulse 1.6s ease-in-out infinite; }
.log-status.error { color: var(--bad); }
.log-body { position: relative; }
.log-scroll { height: min(64vh, 680px); min-height: 280px; overflow: auto; padding: 10px 0; color: var(--log-ink); font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overscroll-behavior: contain; }
.log-scroll:focus-visible { outline-offset: -2px; }
.ll { display: grid; grid-template-columns: auto auto minmax(0, 1fr); column-gap: 12px; padding: 0 14px; }
.ll:hover { background: var(--log-line); }
.ll .ts { color: var(--log-muted); user-select: none; }
.ll .in { color: var(--log-muted); user-select: none; min-width: 6ch; }
.ll .tx { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.log.nowrap .ll .tx { white-space: pre; overflow-wrap: normal; }
.log.no-inst .ll .in { display: none; }
.ll.err .tx { color: var(--log-err); }
.ll.sys .tx { color: var(--log-sys); font-weight: 650; }
.ll.note .tx { color: var(--log-muted); font-style: italic; }
.ll.hide { display: none; }
.log-empty { color: var(--log-muted); padding: 6px 14px; font-family: var(--font); }
.jump { position: absolute; right: 16px; bottom: 14px; box-shadow: var(--shadow-pop); }

/* ---------- Menus, dialogs, toasts ---------- */
.menu-wrap { position: relative; display: inline-flex; }
.menu {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; min-width: 240px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop); padding: 6px; display: grid; gap: 2px;
}
.menu button { display: grid; gap: 1px; text-align: left; padding: 8px 10px; border: 0; background: transparent; border-radius: var(--radius); cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
.menu button span { color: var(--muted); font-size: 12.5px; }
.menu button.danger { color: var(--bad); }
.menu button:disabled { opacity: .5; cursor: not-allowed; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }

dialog.dlg {
  border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(480px, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-pop);
}
dialog.dlg.wide { width: min(720px, calc(100vw - 32px)); }
dialog.dlg::backdrop { background: rgba(10, 15, 22, .45); }
.dlg-body { padding: 20px 22px 8px; display: grid; gap: 12px; }
.dlg-body h2 { font-size: 17px; }
.dlg-body p { color: var(--ink-2); }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; flex-wrap: wrap; }
.dlg-err { color: var(--bad); font-size: 13px; }

.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: grid; gap: 8px; width: min(400px, calc(100vw - 32px)); }
.toast {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px 11px 14px;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--ink));
  border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); animation: toast-in .18s ease-out;
}
.toast .grow { overflow-wrap: anywhere; padding-top: 3px; }
.toast .grow a { margin-left: 6px; font-weight: 600; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: min(420px, 100%); display: grid; gap: 18px; }
.login-card .brand { padding: 0; font-size: 20px; }
.login-card .panel { padding: 24px; display: grid; gap: 16px; }
.login-card h1 { font-size: 20px; }

/* ---------- Responsive ---------- */
@media (max-width: 1020px) {
  .svc-row { grid-template-columns: minmax(160px, 1.5fr) 120px minmax(150px, 1.3fr) minmax(130px, 1fr); }
  .svc-row .c-type { display: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
  .brand { padding: 4px 0 8px; }
  .nav { display: flex; gap: 2px; overflow-x: auto; margin: 0 -16px; padding: 0 12px 8px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; padding: 6px 10px; }
  .side-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 -16px; padding: 8px 16px; background: var(--surface-2); }
  .side-foot .kv { gap: 6px; }
  .side-foot .signout { margin: 0 0 0 auto; }
  .main { padding: 20px 16px 56px; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 700px) {
  .svc-row.head { display: none; }
  .svc-row { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
  .svc-row .c-name { grid-column: 1; }
  .svc-row .c-state { grid-column: 2; grid-row: 1; justify-self: end; }
  .svc-row .c-url, .svc-row .c-deploy { grid-column: 1 / -1; }
  .svc-row .c-type { display: block; grid-column: 1 / -1; }
  .env-row, .env-head { grid-template-columns: minmax(0, 1fr) auto; }
  .env-row .key { grid-column: 1 / -1; }
  .env-head { display: none; }
  .search input, .log-bar .search input { width: 100%; }
  .search { flex: 1 1 100%; }
  .page-head .actions { width: 100%; }
  h1 { font-size: 20px; }
  .log-scroll { height: 60vh; }
  .ll { grid-template-columns: auto minmax(0, 1fr); }
  .ll .in { display: none; }
  .fact { border-right: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

// Follow a finite log stream (deploy / job). The server replays the stored log
// from the start on every connection, so after a reconnect the lines we
// already have are skipped by position: no gaps, no duplicates.
function followFiniteLog(scope, viewer, { path, check, onEnd }) {
  let es = null;

  let failures = 0;
  let done = false;
  const close = () => { if (es) { es.close(); es = null; } };
  scope.add(() => { done = true; close(); });
  const finish = (message) => {
    done = true;
    close();
    viewer.status(message, '');
    if (!received) viewer.setEmpty('No log output.');
    if (onEnd) onEnd();
  };

    close();
    if (done || !scope.alive) return;
    const skip = received;
    let seen = 0;
    let opened = false;
    viewer.status(follow ? 'Streaming' : 'Loading…', follow ? 'live' : '');
    const source = new EventSource(sseUrl(path, { follow: follow ? 'true' : 'false' }));
    es = source;
    source.onopen = () => { opened = true; };
    source.addEventListener('log', (ev) => {
      seen++;
      if (seen <= skip) return;
      // Count every event (even unparseable ones) so the replay offset stays exact.
      received++;
      failures = 0;
      const l = parseLogLine(ev.data);
      if (l) viewer.append(l);
    });
    source.addEventListener('end', () => finish(follow ? 'Finished' : 'End of log'));
    source.onerror = () => {
      if (done || !scope.alive || es !== source) return;
      close();
      if (!follow && opened) { finish('End of log'); return; }
      failures++;
      if (failures > 8) {
        viewer.status('Disconnected', 'error', { label: 'Reconnect', onClick: () => { failures = 0; retry(); } });
        return;

      viewer.status('Reconnecting…', 'error');
      scope.timeout(retry, Math.min(800 * failures, 5000));
    };
  }
  async function retry() {
    if (done || !scope.alive) return;
    let active;
    try {
      active = await check();
    } catch (e) {
      if (!scope.alive) return;
      if (e && (e.status === 404 || e.status === 401)) { done = true; viewer.status(errMsg(e), 'error'); return; }
      failures++;
      if (failures > 8) { viewer.status(errMsg(e), 'error', { label: 'Reconnect', onClick: () => { failures = 0; retry(); } }); return; }
      scope.timeout(retry, 3000);
      return;
    }
    connect(!!active);
  }
  connect(true);
}

        let msg = null;

}

function parseHash() {

function route() {
  if (!token) { renderLogin(); return; }
  if (!shell) mountShell();
  const parts = parseHash();
  const [a, b] = parts;
  let section = a || 'services';
  let key;
  let mount;
  switch (a || 'services') {
    case 'services':
      if (b) { key = `service:${b}`; mount = viewService; } else { key = 'services'; mount = viewServices; }
      break;
    case 'new-service': section = 'services'; key = 'new-service'; mount = viewNewService; break;
    case 'datastores':
      if (b) { key = `datastore:${b}`; mount = viewDatastore; } else { key = 'datastores'; mount = viewDatastores; }
      break;
    case 'new-datastore': section = 'datastores'; key = 'new-datastore'; mount = viewNewDatastore; break;
    case 'env-groups':
      if (b) { key = `env-group:${b}`; mount = viewEnvGroup; } else { key = 'env-groups'; mount = viewEnvGroups; }
      break;
    case 'new-env-group': section = 'env-groups'; key = 'new-env-group'; mount = viewNewEnvGroup; break;
    case 'blueprints': key = 'blueprints'; mount = viewBlueprints; break;
    default: section = null; key = 'not-found'; mount = viewNotFound;
  }
  setNav(section);
  // Same page (e.g. switching tabs of one service): let it update in place.
  if (current.key === key && current.ctrl && typeof current.ctrl.update === 'function') {
    current.ctrl.update(parts);
    return;

  teardownPage();
  const scope = new Scope();
  const page = h('div', { class: 'page' });
  shell.main.replaceChildren(shell.banner, page);
  current = { key, scope, ctrl: null };
  window.scrollTo(0, 0);

    current.ctrl = mount(scope, page, parts) || null;
  } catch (e) {
    console.error(e);

}

    h('fieldset', { class: 'fieldset' }, h('legend', null, 'Build and deploy'), sf.buildEls),
    h('fieldset', { class: 'fieldset' }, h('legend', null, 'Environment'), h('p', { class: 'desc' }, ENV_HELP), env.el),
    h('fieldset', { class: 'fieldset' }, h('legend', null, 'Env groups'), groupsBox),
    h('fieldset', { class: 'fieldset' }, h('legend', null, 'Deploy'), autoDeploy, deployNow),
    formErr,
    h('div', { class: 'form-actions' }, submit, h('a', { class: 'btn btn-ghost', href: '#/services' }, 'Cancel')));
  page.append(form);
  form.addEventListener('input', () => { touched = true; });
  sf.F.runtime.control.addEventListener('change', sync);
  name.addEventListener('input', sync);
  sync();

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    formErr.hidden = true;
    const nameProblem = validateResourceName(name.value.trim());
    fName.setError(nameProblem);
    const problems = sf.validate(st.source);
    if (nameProblem) problems.unshift(fName);
    const envProblem = env.validate();
    if (problems.length || envProblem) {
      formErr.textContent = envProblem && !problems.length ? `Environment: ${envProblem}` : 'Fix the highlighted fields.';
      formErr.hidden = false;
      if (problems.length) problems[0].control.focus();
      return;
    }
    const { v, opt } = sf;
    const body = { name: name.value.trim(), type: st.type };
    if (st.source === 'git') { body.repo_url = v('repo_url'); body.branch = v('branch') || 'main'; body.auto_deploy = autoDeploy.input.checked; }
    if (st.source === 'image') body.image = v('image');
    if (st.source !== 'image') {
      body.runtime = sf.F.runtime.control.value;
      body.root_dir = opt('root_dir');
      body.dockerfile_path = opt('dockerfile_path');
      body.build_command = opt('build_command');
      body.publish_dir = opt('publish_dir');
    }
    body.start_command = opt('start_command');
    if (opt('port')) body.port = Number(v('port'));
    body.health_check_path = opt('health_check_path');
    if (!sf.F.instances.hidden) body.instances = Number(v('instances') || '1');
    body.schedule = opt('schedule');
    body.disk_mount_path = opt('disk_mount_path');
    const vars = env.getVars();
    if (vars.length) body.env = vars;
    const groups = groupChecks.filter((c) => c.checked).map((c) => c.value);
    if (groups.length) body.env_groups = groups;
    if (st.source !== 'upload') body.deploy = deployNow.input.checked;
    await busy(submit, async () => {
      try {
        const created = await api.post('/services', body);
        submitted = true;
        const svcName = (created && created.name) || body.name;
        toast(`Created ${svcName}.`, 'ok');
        const dep = created && created.latest_deploy;
        navigate(dep && dep.id ? linkTo('services', svcName, 'deploys', dep.id) : linkTo('services', svcName));
      } catch (e) {
        formErr.textContent = errMsg(e);
        formErr.hidden = false;
        toastError(e, 'Creating the service failed');
      }
    });
  });
  name.focus();
  return { isDirty: () => touched && !submitted };
}

const SERVICE_TABS = [
  ['overview', 'Overview', tabOverview],
  ['deploys', 'Deploys', tabDeploys],
  ['logs', 'Logs', tabLogs],
  ['environment', 'Environment', tabEnvironment],
  ['settings', 'Settings', tabSettings],
  ['jobs', 'Jobs', tabJobs],
];

function viewService(scope, page, parts) {
  const name = parts[1];
  setTitle(name);
  const ctx = { name, svc: null, scope, tab: null, sub: null, tabScope: null, tabCtrl: null, listeners: new Set() };
  const badges = h('span', { class: 'row' });
  const sub = h('div', { class: 'sub' });
  const actions = h('div', { class: 'actions' });
  const h1 = h('h1', { tabindex: '-1' }, name);
  const crumb = crumbs({ label: 'Services', href: '#/services' }, { label: name });
  const head = h('div', null, crumb,
    h('div', { class: 'page-head' }, h('div', { class: 'grow' }, h('div', { class: 'title' }, h1, badges), sub), actions));
  const tabsNav = h('nav', { class: 'tabs', 'aria-label': 'Service sections' });
  const tabLinks = {};
  for (const [key, label] of SERVICE_TABS) tabsNav.append(tabLinks[key] = h('a', { href: linkTo('services', name, key === 'overview' ? null : key) }, label));
  const body = h('div', null, loadingState());
  page.append(head, tabsNav, body);
  tabsNav.hidden = true;

  ctx.onService = (fn) => { ctx.listeners.add(fn); return () => ctx.listeners.delete(fn); };
  ctx.apply = (svc) => {
    if (!svc || typeof svc !== 'object') return;
    ctx.svc = svc;
    drawHeaderM([svc, offline]);
    for (const fn of [...ctx.listeners]) { try { fn(svc); } catch (e) { console.error(e); } }
  };
  scope.onNet(() => { if (ctx.svc) ctx.apply(ctx.svc); });
  ctx.refresh = async () => {
    try {
      const svc = await api.get(`/services/${enc(name)}`);
      if (!scope.alive) return null;
      refreshOk(scope);
      ctx.apply(svc);
      return svc;
    } catch (e) {
      if (!scope.alive) return null;
      if (isNotFound(e) && ctx.svc) {
        toast(`${name} no longer exists.`, 'error');
        navigate('#/services');
      } else if (ctx.svc) refreshFailed(scope, e);
      throw e;
    }
  };

  const deployMenu = menuButton('Manual deploy', () => deployMenuItems(ctx), { primary: true });
  function drawHeader() {
    const svc = ctx.svc;
    // The route may use the id; show the name once it is known.
    if (svc.name && h1.textContent !== svc.name) { h1.textContent = svc.name; crumb.lastChild.textContent = svc.name; }
    swap(badges, h('span', { class: 'badge' }, typeLabel(svc.type)), statePill(svc.state));
    const bits = [];
    if (isPublic(svc) && svc.url) bits.push(externalLink(svc.url));
    else if (isListening(svc)) bits.push(h('code', { title: 'Address on the private network' }, svc.internal_port ? `${svc.internal_host || svc.name}:${svc.internal_port}` : svc.internal_host || svc.name));
    if (isCron(svc)) bits.push(h('span', null, 'Runs ', h('code', null, svc.schedule || '—'), ' UTC'));
    const src = sourceOf(svc);
    if (src === 'git') bits.push(h('span', { class: 'ellipsis', style: { maxWidth: '420px' }, title: svc.repo_url }, svc.repo_url, ' @ ', h('code', null, svc.branch || 'main')));
    else if (src === 'image') bits.push(h('code', { class: 'ellipsis', style: { maxWidth: '420px' } }, svc.image));
    else bits.push(h('span', null, 'Deployed with ', h('code', null, 'ferry up')));
    swap(sub, bits);
    if (!actions.firstChild) actions.append(deployMenu);
  }
  // Polls redraw the header only when it changes (keeps text selections).
  const drawHeaderM = memo(drawHeader);

  function mountTab(tab, subId) {
    ctx.tab = tab;
    ctx.sub = subId || null;
    if (ctx.tabScope) ctx.tabScope.dispose();
    ctx.tabScope = scope.child();
    ctx.tabCtrl = null;
    for (const [key, a] of Object.entries(tabLinks)) {
      if (key === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    const entry = SERVICE_TABS.find(([key]) => key === tab);
    const label = entry ? entry[1] : 'Not found';
    setTitle(`${label} · ${name}`);
    body.replaceChildren();
    if (!entry) {
      body.append(h('div', { class: 'panel empty' }, h('p', null, 'This section doesn’t exist.'), h('a', { class: 'btn', href: linkTo('services', name) }, 'Go to overview')));
      return;
    }
    try {
      ctx.tabCtrl = entry[2](ctx, ctx.tabScope, body) || null;
    } catch (e) {
      console.error(e);
      body.replaceChildren(errorState(e, () => mountTab(tab, subId), 'This section failed to render'));
    }
  }

  (async () => {
    try {
      await ctx.refresh();
    } catch (e) {
      if (!scope.alive) return;
      if (isNotFound(e)) {
        swap(body, h('div', { class: 'panel empty' }, h('h2', null, `There’s no service named “${name}”`),
          h('p', null, 'It may have been deleted, or the address is mistyped.'), h('a', { class: 'btn', href: '#/services' }, 'Back to services')));
      } else {
        swap(body, errorState(e, () => route()));
      }
      return;
    }
    if (!scope.alive) return;
    tabsNav.hidden = false;
    const now = parseHash();
    mountTab(now[2] || 'overview', now[3]);
    scope.poll(() => ctx.refresh().catch(() => {}));
  })();

  return {
    update(p) {
      if (!ctx.svc) return;
      const tab = p[2] || 'overview';
      const subId = p[3] || null;
      if (tab === ctx.tab && subId === ctx.sub) return;
      mountTab(tab, subId);
      window.scrollTo(0, 0);
    },
    isDirty: () => !!(ctx.tabCtrl && typeof ctx.tabCtrl.isDirty === 'function' && ctx.tabCtrl.isDirty()),
  };
}

// ---------- service actions ----------
function deployMenuItems(ctx) {
  const svc = ctx.svc;
  if (!svc) return [];
  const off = !!svc.suspended;
  const why = off ? 'Resume the service to deploy' : null;
  const src = sourceOf(svc);
  if (src === 'git') {
    return [
      { label: 'Deploy latest commit', hint: why || `Build the tip of ${svc.branch || 'main'}`, disabled: off, onSelect: () => startDeploy(ctx, {}) },
      { label: 'Deploy a specific commit…', hint: why || 'Build an exact commit SHA', disabled: off, onSelect: () => deployCommitDialog(ctx) },
      'sep',
      { label: 'Clear build cache & deploy', hint: why || 'Rebuild every layer from scratch', disabled: off, onSelect: () => startDeploy(ctx, { clear_cache: true }) },
    ];
  }
  if (src === 'image') {
    return [{ label: 'Deploy image', hint: why || `Pull ${svc.image} and roll it out`, disabled: off, onSelect: () => startDeploy(ctx, {}) }];
  }
  return [
    { label: 'Redeploy last upload', hint: why || 'Rebuild the most recent ferry up archive', disabled: off, onSelect: () => startDeploy(ctx, {}) },
    { label: 'Clear build cache & redeploy', hint: why || 'Rebuild every layer from scratch', disabled: off, onSelect: () => startDeploy(ctx, { clear_cache: true }) },
  ];
}
async function startDeploy(ctx, { commit, clear_cache } = {}) {
  try {
    const d = await api.post(`/services/${enc(ctx.name)}/deploys`, { commit: commit || undefined, clear_cache: !!clear_cache });
    toast(clear_cache ? 'Deploy queued without build cache.' : 'Deploy queued.', 'ok');
    ctx.refresh().catch(() => {});
    if (d && d.id) navigate(linkTo('services', ctx.name, 'deploys', d.id));
  } catch (e) {
    toastError(e, 'Couldn’t start the deploy');
  }
}
function deployCommitDialog(ctx) {
  promptDialog({
    title: 'Deploy a specific commit', label: 'Commit SHA', mono: true, placeholder: 'a1b2c3d',
    hint: `A commit reachable from ${ctx.svc && ctx.svc.repo_url ? 'the repository' : 'the branch'}. Short SHAs work.`,
    confirmLabel: 'Deploy', validate: (v) => (/^[0-9a-fA-F]{4,40}$/.test(v) ? null : 'Enter a hexadecimal commit SHA (4–40 characters).'),
  }).then((sha) => { if (sha) startDeploy(ctx, { commit: sha }); });

function cancelDeployDialog(ctx, d, after) {

    title: 'Cancel this deploy?',

const STATE_HELP = {

  deploying: 'A deploy is in progress.',

}
function usageCell(label, ratio) {

function deployRoute(d, svc) {

  const stages = cron ? ['Queued', buildLabel, 'Live'] : ['Queued', buildLabel, 'Deploy', 'Live'];
  const deployAt = cron ? 1 : 2;
  let at = 0;
  let mode = 'current';
  switch (d.status) {
    case 'queued': at = 0; break;
    case 'building': at = 1; break;
    case 'deploying': at = deployAt; break;
    case 'live': case 'deactivated': at = stages.length - 1; mode = 'done'; break;
    case 'build_failed': at = 1; mode = 'failed'; break;
    case 'deploy_failed': at = deployAt; mode = 'failed'; break;
    case 'canceled': at = !d.started_at ? 0 : d.image ? deployAt : 1; mode = 'halted'; break;

// Logs tab (runtime logs)
// ======================================================================
function tabLogs(ctx, scope, body) {
  if (isCron(ctx.svc)) {
    body.append(callout('none', 'info', h('strong', null, 'Cron jobs log per run'),
      h('p', null, 'Each run’s output is kept with the run. ', h('a', { href: linkTo('services', ctx.name, 'jobs') }, 'Open the job history'), '.')));
    return null;
  }
  let follow = true;
  const followBtn = h('button', { class: 'btn btn-sm', type: 'button', 'aria-pressed': 'true', title: 'Stream new lines as they arrive' }, icon('pause'), 'Pause');
  const tailSel = select([['100', 'Last 100 lines'], ['500', 'Last 500 lines'], ['1000', 'Last 1,000 lines'], ['5000', 'Last 5,000 lines']], '500', { 'aria-label': 'Lines of history to load', style: { width: 'auto', height: '28px' } });
  const clearBtn = h('button', { class: 'btn btn-sm', type: 'button', title: 'Clear the view (logs stay on the server)' }, 'Clear');
  const viewer = logViewer({ instances: true, tools: [followBtn, tailSel, clearBtn], emptyText: 'Connecting…', filename: `${ctx.name}-runtime.log` });
  body.append(viewer.el);

  const emptyText = () => {
    const svc = ctx.svc;
    if (svc.suspended) return 'The service is suspended, so no instances are running.';
    if (!svc.live_deploy_id) return 'No instances yet. Logs appear once a deploy is live.';
    return follow ? 'No output yet. New lines appear here as instances write them.' : 'No output.';
  };
  // Dedupe across reconnects (a new connection replays the last lines of each instance).
  const seen = new Set();
  const seenQueue = [];
  const remember = (key) => {
    if (seen.has(key)) return false;
    seen.add(key);
    seenQueue.push(key);
    if (seenQueue.length > 6000) seen.delete(seenQueue.shift());
    return true;
  };
  let es = null;
  let gen = 0;
  let backoff = 0;
  const close = () => { if (es) { es.close(); es = null; } };
  scope.add(close);
  const DELAYS = [1000, 2000, 3000, 5000, 8000, 12000, 15000];
  function connect(tail) {
    close();
    const myGen = ++gen;
    let got = 0;
    viewer.status(follow ? 'Connecting…' : 'Loading…', '');
    const source = new EventSource(sseUrl(`/services/${enc(ctx.name)}/logs`, { follow: follow ? 'true' : 'false', tail }));
    es = source;
    source.onopen = () => { if (myGen === gen && follow) viewer.status('Live', 'live'); };
    source.addEventListener('log', (ev) => {
      if (myGen !== gen) return;
      const l = parseLogLine(ev.data);
      if (!l) return;
      got++;
      backoff = 0;
      if (remember(`${l.ts}|${l.instance || ''}|${l.line}`)) viewer.append(l);
    });
    const ended = (errored) => {
      if (myGen !== gen || !scope.alive) return;
      close();
      viewer.setEmpty(emptyText());
      if (!follow) {
        viewer.status(errored && !got ? 'Couldn’t load logs' : 'Paused', errored && !got ? 'error' : '');
        return;
      }
      // Instances come and go (deploys, restarts): reconnect to pick up the current set.
      backoff = Math.min(backoff + 1, DELAYS.length - 1);
      viewer.status(errored ? 'Reconnecting…' : 'Waiting for instances…', errored ? 'error' : '');
      scope.timeout(() => { if (myGen === gen && follow) connect(100); }, DELAYS[backoff]);
    };
    source.addEventListener('end', () => ended(false));
    source.onerror = () => ended(true);
  }
  followBtn.addEventListener('click', () => {
    follow = !follow;
    followBtn.setAttribute('aria-pressed', String(follow));
    followBtn.replaceChildren(icon(follow ? 'pause' : 'play'), follow ? 'Pause' : 'Resume');
    if (follow) { backoff = 0; connect(Number(tailSel.value)); }
    else { gen++; close(); viewer.status('Paused', ''); }
  });
  tailSel.addEventListener('change', () => {
    viewer.clear();
    seen.clear();
    seenQueue.length = 0;
    gen++;
    close();
    if (!follow) { follow = true; followBtn.setAttribute('aria-pressed', 'true'); followBtn.replaceChildren(icon('pause'), 'Pause'); }
    connect(Number(tailSel.value));
  });
  clearBtn.addEventListener('click', () => { viewer.clear(); viewer.setEmpty('Cleared. New lines appear here.'); });
  connect(Number(tailSel.value));
  return null;
}

    'publish_dir', 'port', 'health_check_path', 'schedule', 'disk_mount_path'];
  function buildForm(svc) {
    const st = { source: sourceOf(svc) };
    let dirty = false;
    const sf = serviceFields(svc, { withInstances: false });
    const sync = () => sf.sync(svc.type, st.source);
    const srcTiles = tiles(`src-${++fieldSeq}`, [['git', 'Git repository', 'Clone and build'], ['image', 'Docker image', 'Pull a prebuilt image'], ['upload', 'Uploads', 'Deploy with ferry up']],
      st.source, (k) => { st.source = k; dirty = true; sync(); });
    const err = h('p', { class: 'form-error', role: 'alert', hidden: true });
    const saveBtn = h('button', { class: 'btn btn-primary', type: 'submit' }, 'Save changes');
    const saveDeployBtn = h('button', { class: 'btn', type: 'button' }, 'Save and deploy');

      h('fieldset', { class: 'fieldset' }, h('legend', null, 'Build and deploy'), h('p', { class: 'desc' }, isCron(svc)
        ? 'The schedule and start command apply from the next run. Other changes take effect on the next deploy.'
        : 'Changes take effect on the next deploy.'), sf.buildEls),
      err, h('div', { class: 'form-actions' }, saveBtn, saveDeployBtn));
    el.addEventListener('input', () => { dirty = true; });
    sf.F.runtime.control.addEventListener('change', sync);
    sync();
    // UpdateService with only the fields that changed ("" clears a string, port 0 = auto).
    function diff() {
      const { v } = sf;
      const patch = {};
      const str = (key, value) => { if (!sf.F[key].hidden && value !== (svc[key] || '')) patch[key] = value; };
      if (st.source === 'git') {
        if (v('repo_url') !== (svc.repo_url || '')) patch.repo_url = v('repo_url');
        if ((v('branch') || 'main') !== svc.branch) patch.branch = v('branch') || 'main';
        if (svc.image) patch.image = '';
      } else if (st.source === 'image') {
        if (v('image') !== (svc.image || '')) patch.image = v('image');
        if (svc.repo_url) patch.repo_url = '';
      } else {
        if (svc.repo_url) patch.repo_url = '';
        if (svc.image) patch.image = '';
      }
      if (st.source !== 'image') {
        if (sf.F.runtime.control.value !== svc.runtime) patch.runtime = sf.F.runtime.control.value;
        for (const k of ['root_dir', 'dockerfile_path', 'build_command', 'publish_dir']) str(k, v(k));
      }
      for (const k of ['start_command', 'health_check_path', 'schedule', 'disk_mount_path']) str(k, v(k));
      if (!sf.F.port.hidden) {
        const p = v('port') ? Number(v('port')) : null;
        if (p !== (svc.port ?? null)) patch.port = p == null ? 0 : p;
      }
      return patch;
    }
    async function save(andDeploy) {
      err.hidden = true;

      if (problems.length) { problems[0].control.focus(); err.textContent = 'Fix the highlighted fields.'; err.hidden = false; return; }
      const patch = diff();
      try {
        if (Object.keys(patch).length) {
          const view = await api.patch(`/services/${enc(ctx.name)}`, patch);
          dirty = false;
          ctx.apply(view);
          // Cron runs read the schedule and start command at run time.
          const keys = Object.keys(patch);
          const atRun = isCron(svc) ? keys.filter((k) => k === 'schedule' || k === 'start_command').length : 0;
          toast(andDeploy ? 'Settings saved.' : !atRun ? 'Settings saved. They apply on the next deploy.'
            : atRun === keys.length ? 'Settings saved. They apply from the next run.'
              : 'Settings saved. Schedule and command apply from the next run, the rest on the next deploy.', 'ok');
        } else if (!andDeploy) {

        }

        if (andDeploy) await startDeploy(ctx, {});
      } catch (e) {
        err.textContent = errMsg(e);
        err.hidden = false;
        toastError(e, 'Saving failed');

    el.addEventListener('submit', (ev) => { ev.preventDefault(); busy(saveBtn, () => save(false)); });

        rm.addEventListener('click', () => confirmDialog({

          action: async () => { domains = await api.del(`/services/${enc(ctx.name)}/domains/${enc(d)}`); },
        }).then((ok) => { if (ok) { toast(`Removed ${d}.`, 'ok'); drawDomainsM(domainsKey(ctx.svc), ctx.svc); ctx.refresh().catch(() => {}); } }));
        return h('div', { class: 'item' }, h('code', { class: 'grow' }, d), rm);
      }),
    ];
    const inp = input({ class: 'input mono', placeholder: 'app.example.com', 'aria-label': 'Custom domain', style: { maxWidth: '360px' }, 'data-fk': 'dom-input' });
    const addBtn = h('button', { class: 'btn', type: 'submit', 'data-fk': 'dom-add' }, icon('plus'), 'Add domain');
    const errEl = h('p', { class: 'form-error', role: 'alert', hidden: true });
    const addForm = h('form', { class: 'row', style: { marginTop: '10px' }, novalidate: true }, inp, addBtn);
    addForm.addEventListener('submit', (ev) => {

      const ok = d.length <= 253 && d.includes('.') && d.split('.').every((l) => /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/.test(l));
      if (!ok) { errEl.textContent = 'Enter a domain name such as app.example.com.'; errEl.hidden = false; inp.focus(); return; }
      errEl.hidden = true;
      busy(addBtn, async () => {
        try {

          toast(`Added ${d}.`, 'ok');
          drawDomainsM(domainsKey(ctx.svc), ctx.svc);
          ctx.refresh().catch(() => {});
        } catch (e) { errEl.textContent = errMsg(e); errEl.hidden = false; }

    swap(domainsBox,
      sectionHead('Custom domains', tls

        : 'Point a CNAME or A record at this server. Automatic HTTPS is off on this server, so domains are served over HTTP.'),
      h('div', { class: 'panel items' }, rows.length ? rows : h('div', { class: 'item muted' }, 'No domains.')),
      addForm, errEl);
  }
  const loadDomains = async () => {
    if (!isPublic(ctx.svc)) return;
    try { const d = await api.get(`/services/${enc(ctx.name)}/domains`); if (!scope.alive) return; domains = Array.isArray(d) ? d : []; drawDomainsM(domainsKey(ctx.svc), ctx.svc); } catch (e) { console.warn(e); }
  };

  // ----- auto-deploy, deploy hook, danger zone -----
  function drawAuto(svc) {
    if (sourceOf(svc) !== 'git') {
      swap(autoBox, sectionHead('Auto-deploy', 'Available for services that build from a Git repository.'));
      return;
    }
    const sw = switchControl(`Deploy on every push to ${svc.branch || 'main'}`, svc.auto_deploy, async (checked, cb) => {
      cb.disabled = true;
      try {
        ctx.apply(await api.patch(`/services/${enc(ctx.name)}`, { auto_deploy: checked }));
        toast(checked ? 'Auto-deploy is on.' : 'Auto-deploy is off.', 'ok');
      } catch (e) { cb.checked = !checked; toastError(e, 'Couldn’t change auto-deploy'); } finally { cb.disabled = false; }
    });
    sw.input.dataset.fk = 'auto-deploy';
    const hookUrl = `${publicOrigin()}/hooks/github`;
    const gh = serverInfo && serverInfo.github_webhook_enabled
      ? h('div', { class: 'stack', style: { gap: '6px', marginTop: '12px' } },
        h('p', { class: 'muted' }, 'In the repository’s GitHub settings, add a webhook for push events with content type application/json, this payload URL, and the secret ferryd was started with:'),
        h('div', { class: 'secret' }, h('code', { class: 'value' }, hookUrl), copyButton(hookUrl, 'Copy webhook URL', 'Copied webhook URL')),
        localHint(hookUrl, 'GitHub'))

    swap(autoBox, sectionHead('Auto-deploy'), h('div', { class: 'panel panel-pad' }, sw, gh));
  }
  function drawHook(svc) {
    if (!svc.deploy_hook_path) { hookBox.hidden = true; return; }
    hookBox.hidden = false;
    const url = publicOrigin() + svc.deploy_hook_path;

      sectionHead('Deploy hook', 'Send a GET or POST to this secret URL to start a deploy, for example from CI. Anyone with the URL can deploy this service.'),
      h('div', { class: 'panel panel-pad stack' },
        secretField(url, { mask: (u) => u.replace(/([?&]key=)[^&]*/, (_m, p) => p + '•'.repeat(16)), label: 'deploy hook URL' }),
        localHint(url, 'Other machines'),

  }
  function rotateHook() {

  }
  function localHint(url, who) {
    return isLoopback(url) ? h('p', { class: 'hint', style: { color: 'var(--warn)' } }, `${who} can’t reach this local address: serve Ferry on a public host (ferryd --dashboard-host, with HTTPS).`) : null;
  }
  function drawDanger() {
    swap(dangerBox, sectionHead('Delete service'),
      h('div', { class: 'panel items' }, h('div', { class: 'item' },
        h('p', { class: 'grow muted' }, 'Permanently remove the service, its deploys, images, variables and disk.'),
        h('button', { class: 'btn btn-danger', type: 'button', onclick: () => deleteServiceDialog(ctx) }, icon('trash'), 'Delete service'))));
  }
  const drawFormM = memo(drawForm);
  const drawDomainsM = memo(drawDomains);
  const drawAutoM = memo(drawAuto);
  const drawHookM = memo(drawHook);
  const domainsKey = (svc) => [svc.type, svc.hosts, svc.custom_domains, domains, serverInfo && serverInfo.tls_enabled];
  const drawAll = (svc) => {
    if (!form || !form.isDirty()) drawFormM([svc.type, SETTINGS_KEYS.map((k) => svc[k])], svc);
    drawDomainsM(domainsKey(svc), svc);
    drawAutoM([sourceOf(svc), svc.branch, svc.auto_deploy, serverInfo && serverInfo.github_webhook_enabled, publicOrigin()], svc);
    drawHookM([svc.deploy_hook_path, publicOrigin()], svc);
  };
  drawAll(ctx.svc);
  drawDanger();
  loadDomains();
  scope.add(ctx.onService(drawAll));
  return { isDirty: () => !!(form && form.isDirty()) };
}

function tabJobs(ctx, scope, body) {
  if (ctx.sub) return jobDetail(ctx, scope, body, ctx.sub);
  const svc = ctx.svc;
  const cron = isCron(svc);
  const cmd = input({ class: 'input mono', placeholder: cron ? (svc.start_command || 'Scheduled command') : 'npm run migrate', 'aria-label': 'Command' });
  const f = field(cron ? 'Command (optional)' : 'Command', cmd, {
    hint: cron ? 'Leave empty to run the scheduled command.' : 'Runs with sh -c in a new container from the live image, with the service’s environment and private network.',
  });
  const runBtn = h('button', { class: 'btn btn-primary', type: 'submit' }, icon('play'), cron ? 'Run now' : 'Run job');
  const runForm = h('form', { class: 'panel panel-pad stack', novalidate: true }, f, h('div', { class: 'row' }, runBtn,
    svc.live_deploy_id ? null : h('span', { class: 'muted' }, 'Jobs need a live deploy.')));
  runForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const command = cmd.value.trim();
    if (!cron && !command) { f.setError('Enter a command to run.'); cmd.focus(); return; }
    f.setError('');
    busy(runBtn, async () => {
      try {
        const job = await api.post(`/services/${enc(ctx.name)}/jobs`, { command: command || undefined });
        toast('Job started.', 'ok');
        if (job && job.id) navigate(linkTo('services', ctx.name, 'jobs', job.id));
      } catch (e) { f.setError(errMsg(e)); toastError(e, 'Couldn’t start the job'); }
    });
  });
  let limit = 25;
  let jobs = null;
  const listBox = h('div', null, loadingState());
  const more = h('button', { class: 'btn', type: 'button', hidden: true }, 'Show older runs');
  body.append(
    h('div', { class: 'section' }, sectionHead(cron ? 'Run now' : 'Run a one-off job',
      cron ? 'Start a run outside the schedule.' : 'Useful for migrations, seeds and maintenance scripts.'), runForm),
    h('div', { class: 'section' }, sectionHead('History', cron ? h('span', null, 'Scheduled ', h('code', null, svc.schedule || '—'), ' (UTC) and manual runs.') : null),
      listBox, h('div', { style: { marginTop: '12px' } }, more)));
  const draw = () => {
    const rows = jobs.map((j) => {
      const href = linkTo('services', ctx.name, 'jobs', j.id);
      return clickRow(href, [
        h('td', null, jobPill(j.status)),
        h('td', { class: 'nowrap' }, h('a', { href, class: 'mono', 'data-fk': `job-${j.id}` }, shortId(j.id)), h('div', { class: 'sub' }, JOB_TRIGGERS[j.trigger] || j.trigger || '')),
        h('td', { class: 'fill' }, j.command ? h('code', { class: 'ellipsis', style: { display: 'block' }, title: j.command }, j.command) : h('span', { class: 'faint' }, 'Default command'),
          j.error ? h('div', { class: 'sub ellipsis', style: { color: 'var(--bad)' }, title: j.error }, j.error) : null),
        h('td', null, timeEl(j.started_at || j.created_at)),
        h('td', { class: 'num nowrap' }, j.started_at ? duration(j.started_at, j.finished_at) : h('span', { class: 'faint' }, '—')),
        h('td', { class: 'num' }, j.exit_code != null ? h('span', { style: { color: j.exit_code === 0 ? 'var(--ok)' : 'var(--bad)' } }, String(j.exit_code)) : h('span', { class: 'faint' }, '—')),
      ], `row-${j.id}`);
    });
    swap(listBox, table(['Status', 'Run', 'Command', 'Started', 'Duration', 'Exit code'], rows, {
      empty: h('div', { class: 'panel empty' }, h('p', null, cron ? 'No runs yet. The first scheduled run appears here once the job is live.' : 'No jobs have run yet.')),
    }));
    more.hidden = jobs.length < limit || limit >= 200;
  };
  const load = async () => {
    try {
      const list = await api.get(`/services/${enc(ctx.name)}/jobs?limit=${limit}`);
      if (!scope.alive) return;
      jobs = Array.isArray(list) ? list : [];
      refreshOk(scope);
      draw();
    } catch (e) {
      if (!scope.alive) return;
      if (!jobs) swap(listBox, errorState(e, () => { swap(listBox, loadingState()); load(); }));
      else refreshFailed(scope, e);
    }
  };
  more.addEventListener('click', () => busy(more, async () => { limit = Math.min(200, limit + 25); await load(); }));
  load();
  scope.poll(load);
  return null;
}
function jobDetail(ctx, scope, body, id) {
  const back = h('a', { href: linkTo('services', ctx.name, 'jobs'), class: 'row muted', style: { display: 'inline-flex', marginBottom: '14px', gap: '4px' } }, icon('chevronLeft'), 'All jobs');
  const headBox = h('div', null, loadingState());
  const viewer = logViewer({ emptyText: 'Waiting for output…', filename: `${ctx.name}-${id}.log` });
  body.append(back, headBox, viewer.el);
  let job = null;
  const draw = () => {
    const j = job;
    const meta = [h('span', null, JOB_TRIGGERS[j.trigger] || j.trigger || 'Job')];
    meta.push(h('span', null, 'Started ', timeEl(j.started_at || j.created_at)));
    if (j.started_at) meta.push(h('span', { class: 'num' }, `${isJobActive(j) ? 'Running for' : 'Took'} ${duration(j.started_at, j.finished_at)}`));
    if (j.exit_code != null) meta.push(h('span', { class: 'num' }, 'Exit code ', h('code', null, String(j.exit_code))));
    swap(headBox,
      h('div', { class: 'page-head', style: { marginBottom: '14px' } },
        h('div', { class: 'grow' },
          h('div', { class: 'title' }, h('h2', { style: { fontSize: '17px' } }, 'Run ', h('code', { title: j.id }, shortId(j.id))), jobPill(j.status), copyButton(j.id, 'Copy job ID', 'Copied job ID')),
          h('div', { class: 'sub' }, meta))),
      j.command ? h('div', { style: { marginBottom: '14px' } }, codeBlock([j.command])) : null,
      j.error ? callout('bad', 'alert', h('strong', null, 'The job failed'), h('p', { class: 'mono' }, j.error)) : null);
  };
  async function load() {
    const j = mine(ctx, await api.get(`/jobs/${enc(id)}`));
    if (!scope.alive) return j;
    job = j;
    draw();
    return j;
  }
  (async () => {
    try { await load(); } catch (e) {
      if (!scope.alive || await reopenUnderOwner(scope, e, 'jobs', id)) return;
      swap(headBox, isNotFound(e) ? h('div', { class: 'panel empty' }, h('h2', null, 'Job not found')) : errorState(e, () => route()));
      viewer.el.hidden = true;
      return;
    }
    if (!scope.alive) return;
    followFiniteLog(scope, viewer, {
      path: `/jobs/${enc(id)}/logs`,
      check: async () => isJobActive(await load()),
      onEnd: () => { load().catch(() => {}); },
    });
    scope.poll(async () => { if (job && isJobActive(job)) await load().catch(() => {}); else if (job) draw(); }, 3000);
  })();
  return null;
}
