    err, h('div', { class: 'form-actions' }, submit, h('a', { class: 'btn btn-ghost', href: '#/datastores' }, 'Cancel')));
  page.append(form);
  form.addEventListener('input', () => { touched = true; });
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    err.hidden = true;
    const n = name.value.trim();
    const problem = validateResourceName(n);
    fName.setError(problem);
    if (problem) { name.focus(); return; }
    const body = { name: n, kind, version: version.value };
    if (kind === 'postgres') {
      if (database.value.trim()) body.database = database.value.trim();
      if (username.value.trim()) body.username = username.value.trim();
    }
    busy(submit, async () => {
      try {
        const ds = await api.post('/datastores', body);
        submitted = true;
        toast(`Creating ${n}…`, 'ok');
        navigate(linkTo('datastores', (ds && ds.name) || n));
      } catch (e) { err.textContent = errMsg(e); err.hidden = false; toastError(e, 'Creating the datastore failed'); }
    });
  });
  name.focus();
  return { isDirty: () => touched && !submitted };
}

function viewDatastore(scope, page, parts) {
  const name = parts[1];
  setTitle(name);
  const badges = h('span', { class: 'row' });
  const delBtn = h('button', { class: 'btn btn-danger', type: 'button' }, icon('trash'), 'Delete');
  const head = pageHead({ crumbs: crumbs({ label: 'Datastores', href: '#/datastores' }, { label: name }), title: name, badges, actions: [delBtn] });
  const body = h('div', null, loadingState());
  page.append(head, body);
  let ds = null;
  const dsForce = forceBox('Delete even if services still reference it');
  delBtn.addEventListener('click', () => confirmDialog({
    title: `Delete ${name}?`,
    message: 'This removes the container and its data volume. Every row or key it holds is permanently lost, and services that reference it will fail to start.',
    confirmLabel: 'Delete datastore', danger: true, typeToConfirm: name, extra: dsForce.el,
    action: () => api.del(`/datastores/${enc(name)}${dsForce.checked ? '?force=true' : ''}`),
  }).then((ok) => { if (ok) { toast(`Deleted ${name}.`, 'ok'); navigate('#/datastores'); } }));

  const draw = () => {
    const d = ds;
    swap(badges, h('span', { class: 'badge' }, `${kindLabel(d.kind)} ${d.version || ''}`.trim()), dsPill(d.status));
    const pw = d.password || '';
    const pg = d.kind === 'postgres';
    const envKey = pg ? 'DATABASE_URL' : 'REDIS_URL';
    const ref = `${envKey}=\${{datastore.${d.name}.connectionString}}`;
    const out = [];
    if (d.status === 'creating') out.push(callout('busy', 'info', h('strong', null, 'Provisioning…'), h('p', null, 'Pulling the image and starting the container. This page updates by itself.')));
    if (d.status === 'failed') out.push(callout('bad', 'alert', h('strong', null, 'Provisioning failed'), d.error ? h('p', { class: 'mono' }, d.error) : null));
    const cli = d.external_url ? (pg ? `psql "${d.external_url}"` : `redis-cli -u "${d.external_url}"`) : null;
    out.push(h('div', { class: 'section' },
      sectionHead('Connections'),
      h('div', { class: 'panel panel-pad stack', style: { gap: '18px' } },
        h('div', { class: 'field' }, h('span', { class: 'label' }, 'Internal URL'),
          secretField(d.internal_url || '', { mask: (u) => maskSecret(u, pw), label: 'internal URL' }),
          h('p', { class: 'hint' }, 'Use this from services on Ferry’s private network.')),
        h('div', { class: 'field' }, h('span', { class: 'label' }, 'External URL'),
          d.external_url
            ? secretField(d.external_url, { mask: (u) => maskSecret(u, pw), label: 'external URL' })
            : h('p', { class: 'muted' }, 'Assigned once the datastore is available.'),
          h('p', { class: 'hint' }, 'Connect from the machine running Ferry, for example with a database client.')),
        cli ? h('div', { class: 'field' }, h('span', { class: 'label' }, pg ? 'psql' : 'redis-cli'), codeBlock([maskSecret(cli, pw)], cli)) : null)));
    out.push(h('div', { class: 'section' }, sectionHead('Details'), facts([
      ['Hostname', h('code', null, d.internal_host || d.name)],
      ['Port', h('code', null, String(d.internal_port ?? '—'))],
      ['External port', d.host_port ? h('code', null, String(d.host_port)) : h('span', { class: 'faint' }, '—')],
      ['User', h('code', null, d.username || '—')],
      ['Password', secretField(pw, { label: 'password' })],
      pg ? ['Database', h('code', null, d.database || '—')] : null,
      ['Created', timeEl(d.created_at)],
    ])));
    out.push(h('div', { class: 'section' },
      sectionHead('Use it from a service', 'Add this variable to a service’s environment. Ferry fills in the connection string each time the service starts, so it stays correct if the password changes.'),
      codeBlock([ref])));
    swap(body, out);
  };
  const drawM = memo(draw);
  let polling = false;
  const load = async () => {
    try {
      const d = await api.get(`/datastores/${enc(name)}`);
      if (!scope.alive) return;
      ds = d;
      refreshOk(scope);
      drawM([d]);
      // Poll only once the datastore is known to exist.
      if (!polling) { polling = true; scope.poll(load); }
    } catch (e) {
      if (!scope.alive) return;
      if (!ds) {
        delBtn.hidden = true;
        swap(body, isNotFound(e)
          ? h('div', { class: 'panel empty' }, h('h2', null, `There’s no datastore named “${name}”`), h('a', { class: 'btn', href: '#/datastores' }, 'Back to datastores'))
          : errorState(e, () => { swap(body, loadingState()); load(); }));
      } else if (isNotFound(e)) {
        toast(`${name} no longer exists.`, 'error');
        navigate('#/datastores');
      } else refreshFailed(scope, e);
    }
  };
  load();
}

// ======================================================================
// Env groups
// ======================================================================
function viewEnvGroups(scope, page) {
  setTitle('Env groups');
  let list = null;
  const body = h('div', null, loadingState());
  page.append(pageHead({
    title: 'Env groups',
    sub: 'Share one set of environment variables between several services.',
    actions: [h('a', { class: 'btn btn-primary', href: '#/new-env-group' }, icon('plus'), 'New env group')],
  }), body);
  const load = async () => {
    try {
      const l = await api.get('/env-groups');
      if (!scope.alive) return;
      list = (Array.isArray(l) ? l : []).slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
      refreshOk(scope);
      const rows = list.map((g) => {
        const href = linkTo('env-groups', g.name);
        const svcs = Array.isArray(g.services) ? g.services : [];
        return clickRow(href, [
          h('td', null, h('a', { href, style: { fontWeight: '600' }, 'data-fk': `eg-${g.name}` }, g.name)),
          h('td', { class: 'num' }, plural((g.vars || []).length, 'variable')),
          h('td', null, svcs.length ? svcs.map((s, i) => [i ? ', ' : null, h('a', { href: linkTo('services', s) }, s)]) : h('span', { class: 'faint' }, 'Not linked')),
          h('td', null, timeEl(g.updated_at)),
        ], `row-${g.name}`);
      });
      swap(body, table(['Name', 'Variables', 'Linked services', 'Updated'], rows, {
        empty: h('div', { class: 'panel empty' }, h('h2', null, 'No env groups yet'),
          h('p', null, 'Put shared settings such as API keys or feature flags in a group, then link it to every service that needs them.'),
          h('a', { class: 'btn btn-primary', href: '#/new-env-group' }, icon('plus'), 'New env group')),
      }));
    } catch (e) {
      if (!scope.alive) return;
      if (!list) swap(body, errorState(e, () => { swap(body, loadingState()); load(); }));
      else refreshFailed(scope, e);
    }
  };
  load();
  scope.poll(load, 10000);
}

function viewNewEnvGroup(scope, page) {
  setTitle('New env group');
  let touched = false;
  let submitted = false;
  page.append(pageHead({ crumbs: crumbs({ label: 'Env groups', href: '#/env-groups' }, { label: 'New env group' }), title: 'New env group' }));
  const name = input({ class: 'input mono', placeholder: 'shared-settings', maxlength: 64 });
  const fName = field('Name', name, { hint: 'Letters, digits, dots, dashes and underscores.' });
  const editor = envEditor([], { onChange: () => { touched = true; } });
  const err = h('p', { class: 'form-error', role: 'alert', hidden: true });
  const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, 'Create env group');
  const form = h('form', { class: 'form', novalidate: true },
    h('fieldset', { class: 'fieldset' }, h('legend', null, 'Name'), fName),
    h('fieldset', { class: 'fieldset' }, h('legend', null, 'Variables'), h('p', { class: 'desc' }, ENV_HELP), editor.el),
    err, h('div', { class: 'form-actions' }, submit, h('a', { class: 'btn btn-ghost', href: '#/env-groups' }, 'Cancel')));
  page.append(form);
  form.addEventListener('input', () => { touched = true; });
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    err.hidden = true;
    const n = name.value.trim();
    const problem = validateEnvGroupName(n);
    fName.setError(problem);
    if (problem) { name.focus(); return; }
    const envProblem = editor.validate();
    if (envProblem) { err.textContent = envProblem; err.hidden = false; return; }
    busy(submit, async () => {
      try {
        const g = await api.post('/env-groups', { name: n, vars: editor.getVars() });
        submitted = true;
        toast(`Created ${n}.`, 'ok');
        navigate(linkTo('env-groups', (g && g.name) || n));
      } catch (e) { err.textContent = errMsg(e); err.hidden = false; toastError(e, 'Creating the group failed'); }
    });
  });
  name.focus();
  return { isDirty: () => touched && !submitted };
}

function viewEnvGroup(scope, page, parts) {
  const name = parts[1];
  setTitle(name);
  let group = null;
  let editor = null;
  const delBtn = h('button', { class: 'btn btn-danger', type: 'button', hidden: true }, icon('trash'), 'Delete');
  page.append(pageHead({ crumbs: crumbs({ label: 'Env groups', href: '#/env-groups' }, { label: name }), title: name, actions: [delBtn] }));
  const body = h('div', null, loadingState());
  page.append(body);
  const linked = () => (group && Array.isArray(group.services) ? group.services : []);
  const bar = envSaveBar(() => editor, {
    restartLabel: 'Save and restart linked services',
    showRestart: () => linked().length > 0,
    onSave: async (vars, restart) => {
      try {
        const g = await api.put(`/env-groups/${enc(name)}/env?restart=${restart ? 'true' : 'false'}`, { vars });
        if (!scope.alive) return;
        group = g;
        editor.setVars(g.vars);
        bar.sync();
        drawLinked();
        toast(restart ? 'Saved. Restarting linked services that are live.' : linked().length ? 'Saved. Linked services pick this up on their next deploy or restart.' : 'Saved.', 'ok');
      } catch (e) { toastError(e, 'Saving failed'); }
    },
  });
  bar.discard.addEventListener('click', () => { if (editor && group) { editor.setVars(group.vars); bar.sync(); } });
  const linkedBox = h('div', { class: 'section' });
  function drawLinked() {
    const svcs = linked();
    swap(linkedBox, sectionHead('Linked services', 'Link or unlink this group from a service’s Environment tab.'),
      svcs.length
        ? h('div', { class: 'panel items' }, svcs.map((s) => h('div', { class: 'item' }, icon('services'), h('a', { class: 'grow', href: linkTo('services', s) }, s),
          h('a', { class: 'btn btn-sm', href: linkTo('services', s, 'environment') }, 'Environment'))))
        : h('p', { class: 'env-empty' }, 'No services use this group yet.'));
  }
  delBtn.addEventListener('click', () => {
    const svcs = linked();
    const restart = forceBox('Restart the linked live services now so they drop these variables');
    confirmDialog({
      title: `Delete ${name}?`,
      message: svcs.length
        ? `It is linked to ${svcs.join(', ')}. Those services lose these variables on their next deploy or restart.`
        : 'The group and its variables are permanently removed.',
      confirmLabel: 'Delete env group', danger: true, typeToConfirm: svcs.length ? name : undefined,
      extra: svcs.length ? restart.el : null,
      action: () => api.del(`/env-groups/${enc(name)}${svcs.length ? `?force=true${restart.checked ? '&restart=true' : ''}` : ''}`),
    }).then((ok) => {
      if (!ok) return;
      toast(`Deleted ${name}.`, 'ok');
      if (current.ctrl) current.ctrl.isDirty = () => false;
      navigate('#/env-groups');
    });
  });
  (async () => {
    try {
      group = await api.get(`/env-groups/${enc(name)}`);
    } catch (e) {
      if (!scope.alive) return;
      swap(body, isNotFound(e)
        ? h('div', { class: 'panel empty' }, h('h2', null, `There’s no env group named “${name}”`), h('a', { class: 'btn', href: '#/env-groups' }, 'Back to env groups'))
        : errorState(e, () => route()));
      return;
    }
    if (!scope.alive) return;
    delBtn.hidden = false;
    editor = envEditor(group.vars, { onChange: () => bar.sync() });
    swap(body, h('div', { class: 'section' }, sectionHead('Variables', ENV_HELP), editor.el, bar), linkedBox);
    drawLinked();
    bar.sync();
  })();
  return { isDirty: () => !!(editor && editor.isDirty()) };
}

// ======================================================================
// Blueprints
// ======================================================================
const BLUEPRINT_EXAMPLE = `# ferry.yaml or render.yaml
services:
  - type: web
    name: hello
    image: nginx:alpine
    port: 80
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: app-db, property: connectionString }
databases:
  - name: app-db`;
function viewBlueprints(scope, page) {
  setTitle('Blueprints');
  page.append(pageHead({ title: 'Blueprints', sub: 'Describe services, datastores and env groups in YAML and apply them in one step. Existing resources are updated in place; nothing is ever deleted.' }));
  const ta = h('textarea', { class: 'input mono', rows: 20, spellcheck: 'false', placeholder: BLUEPRINT_EXAMPLE, 'aria-label': 'Blueprint YAML' });
  ta.value = session.get(BLUEPRINT_DRAFT_KEY) || '';
  let draftTimer = 0;
  ta.addEventListener('input', () => {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => session.set(BLUEPRINT_DRAFT_KEY, ta.value), 400);
  });
  scope.add(() => { clearTimeout(draftTimer); if (token) session.set(BLUEPRINT_DRAFT_KEY, ta.value); });
  const file = h('input', { type: 'file', accept: '.yaml,.yml,application/yaml,text/yaml', class: 'sr-only', id: 'bp-file' });
  const readFile = async (f) => {
    if (!f) return;
    if (f.size > 2 * 1024 * 1024) { toast('That file is larger than 2 MB.', 'error'); return; }
    try { ta.value = await f.text(); session.set(BLUEPRINT_DRAFT_KEY, ta.value); toast(`Loaded ${f.name}.`, 'ok', { timeout: 2000 }); } catch (e) { toastError(e, 'Reading the file failed'); }
  };
  file.addEventListener('change', () => { readFile(file.files && file.files[0]); file.value = ''; });
  ta.addEventListener('dragover', (ev) => { ev.preventDefault(); });
  ta.addEventListener('drop', (ev) => {
    const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (f) { ev.preventDefault(); readFile(f); }
  });
  const dryBtn = h('button', { class: 'btn', type: 'button' }, 'Dry run');
  const applyBtn = h('button', { class: 'btn btn-primary', type: 'button' }, 'Apply blueprint');
  const err = h('p', { class: 'form-error', role: 'alert', hidden: true });
  const result = h('div', { class: 'section', style: { marginTop: '28px' }, 'aria-live': 'polite' });
  page.append(
    h('div', { class: 'stack', style: { maxWidth: '900px' } },
      h('div', { class: 'row' }, h('label', { class: 'btn btn-sm', for: 'bp-file' }, icon('upload'), 'Open a file…'), file,
        h('span', { class: 'muted' }, 'or paste YAML below. You can also drop a file on the editor.')),
      ta, err,
      h('div', { class: 'form-actions' }, dryBtn, applyBtn, h('span', { class: 'muted' }, 'A dry run shows what would change without touching anything.'))),
    result);

  async function run(dry, btn) {
    err.hidden = true;
    const yaml = ta.value;
    if (!yaml.trim()) { err.textContent = 'Paste a blueprint or open a file first.'; err.hidden = false; ta.focus(); return; }
    await busy(btn, async () => {
      try {
        const r = await api.post('/blueprints/apply', { yaml, dry_run: dry });
        if (!scope.alive) return;
        let names = {};
        const deploys = r && Array.isArray(r.deploys) ? r.deploys : [];
        if (deploys.length) {
          try { const svcs = await api.get('/services'); for (const s of svcs || []) names[s.id] = s.name; } catch { names = {}; }
        }
        if (!scope.alive) return;
        drawResult(r || {}, names);
        if (!dry) toast('Blueprint applied.', 'ok');
      } catch (e) {
        err.textContent = errMsg(e);
        err.hidden = false;
        swap(result);
      }
    });
  }
  dryBtn.addEventListener('click', () => run(true, dryBtn));
  applyBtn.addEventListener('click', () => run(false, applyBtn));

  function resourceLink(a, exists) {
    if (!exists) return h('code', null, a.name);
    const href = a.resource === 'service' ? linkTo('services', a.name) : a.resource === 'datastore' ? linkTo('datastores', a.name) : a.resource === 'env_group' ? linkTo('env-groups', a.name) : null;
    return href ? h('a', { href, class: 'mono' }, a.name) : h('code', null, a.name);
  }
  function drawResult(r, names) {
    const actions = Array.isArray(r.actions) ? r.actions : [];
    const warnings = Array.isArray(r.warnings) ? r.warnings : [];
    const deploys = Array.isArray(r.deploys) ? r.deploys : [];
    const count = (k) => actions.filter((a) => a.action === k).length;
    const summary = r.dry_run
      ? `${count('create')} to create, ${count('update')} to update, ${count('unchanged')} unchanged.`
      : `${count('create')} created, ${count('update')} updated, ${count('unchanged')} unchanged.`;
    const out = [sectionHead(r.dry_run ? 'Dry run: nothing was changed' : 'Blueprint applied', summary)];
    if (warnings.length) {
      out.push(callout('warn', 'alert', h('strong', null, plural(warnings.length, 'warning')), h('ul', { style: { margin: '0', paddingLeft: '18px' } }, warnings.map((w) => h('li', null, w)))));
    }
    out.push(table(['Resource', 'Name', 'Action', 'Changes'], actions.map((a) => h('tr', null,
      h('td', null, BLUEPRINT_RESOURCES[a.resource] || a.resource),
      h('td', null, resourceLink(a, !(r.dry_run && a.action === 'create'))),
      h('td', null, pill(BLUEPRINT_ACTIONS, a.action)),
      h('td', null, Array.isArray(a.changes) && a.changes.length
        ? h('ul', { style: { margin: '0', paddingLeft: '18px' } }, a.changes.map((c) => h('li', null, c)))
        : h('span', { class: 'faint' }, '—')))),
    { empty: h('div', { class: 'panel empty' }, h('p', null, 'The blueprint doesn’t define any resources.')) }));
    if (deploys.length) {
      out.push(h('div', { class: 'section', style: { marginTop: '22px' } }, sectionHead('Deploys started'),
        h('div', { class: 'panel items' }, deploys.map((d) => {
          const svcName = names[d.service_id] || d.service_id;
          return h('div', { class: 'item' }, deployPill(d.status),
            h('a', { class: 'grow', href: linkTo('services', svcName, 'deploys', d.id) }, svcName),
            h('span', { class: 'muted' }, triggerLabel(d.trigger)));
        }))));
    }
    swap(result, out);
    result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// ======================================================================
// Boot
// ======================================================================
// The skip link must not touch the hash (the router owns it): focus <main> directly.
const skipLink = document.querySelector('.skip');
if (skipLink) {
  skipLink.addEventListener('click', (ev) => {
    ev.preventDefault();
    const target = document.querySelector('.page h1') || document.getElementById('main');
    if (target) { if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1'); target.focus(); }
  });
}
storage.del(BLUEPRINT_DRAFT_KEY); // older versions kept drafts in localStorage
if (!token) renderLogin();
else route();
})();
</script>
