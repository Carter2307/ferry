[package]
name = "ferry-engine"
description = "Deploy orchestration, reconciliation, cron and datastores for Ferry"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-core.workspace = true
ferry-docker.workspace = true
ferry-build.workspace = true
ferry-proxy.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
async-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
reqwest.workspace = true
# Through `Docker::bollard()` (ferry-docker's escape hatch) for what its typed
# API does not expose: the last exit code of a restarting container and the
# labels of an existing volume.
bollard.workspace = true

[target.'cfg(unix)'.dependencies]
# statvfs, for the free disk space check.
libc = "0.2.189"

[dev-dependencies]
tempfile.workspace = true
# The Basic credentials the test git server expects.
base64.workspace = true
# E2E tests print engine logs when RUST_LOG is set.
tracing-subscriber.workspace = true
