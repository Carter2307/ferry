sqlx.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Tests build a Docker client for an unreachable daemon (Docker-free tests).
bollard.workspace = true
# E2E tests print engine logs when RUST_LOG is set.
tracing-subscriber.workspace = true
