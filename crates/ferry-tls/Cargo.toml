[package]
name = "ferry-tls"
description = "Automatic HTTPS (ACME / Let's Encrypt HTTP-01) and SNI certificate resolution for Ferry"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
# ring (not the default aws-lc-rs) so the whole process uses a single crypto provider.
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen.workspace = true
x509-parser = "0.18.1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true
